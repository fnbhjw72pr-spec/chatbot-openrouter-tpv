<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity AI | Assistant Étudiant</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }

        .chat-container {
            width: 95%;
            max-width: 600px;
            height: 85vh;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            padding: 25px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        /* Personnalisation Scrollbar */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .bot {
            align-self: flex-start;
            background: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 14px 20px;
            border-radius: 14px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .typing {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-left: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <h1>Trinity Assistant v2</h1>
    </div>

    <div id="chat-box">
        <div class="message bot">Prêt pour une session d'étude ? Posez-moi vos questions sur n'importe quel sujet.</div>
    </div>

    <div id="typing-indicator" class="typing">Trinity analyse votre demande...</div>

    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Décrivez votre concept ou exercice..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
    const API_KEY = "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";
    const MODEL = "arcee-ai/trinity-large-preview:free";

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const typingIndicator = document.getElementById("typing-indicator");
        const message = input.value.trim();
        
        if (message === "") return;

        addMessage("user", message);
        input.value = "";
        typingIndicator.style.display = "block";

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": MODEL,
                    "messages": [
                        {"role": "system", "content": "Tu es Trinity, un assistant pédagogique expert. Tu donnes des réponses structurées, encourageantes et précises pour aider les étudiants."},
                        {"role": "user", "content": message}
                    ]
                })
            });

            const data = await response.json();
            typingIndicator.style.display = "none";
            
            const botText = data.choices[0].message.content;
            addMessage("bot", botText);

        } catch (error) {
            typingIndicator.style.display = "none";
            addMessage("bot", "Erreur technique. Vérifiez votre connexion ou la clé API.");
            console.error(error);
        }
    }

    function addMessage(sender, text) {
        const chatBox = document.getElementById("chat-box");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
